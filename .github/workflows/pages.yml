# Sitio estático — https://docs.github.com/en/pages/getting-started-with-github-pages
#
# Si falla el paso "Desplegar" con error 422:
#   Repo → Settings → Pages → Build and deployment → Source → "GitHub Actions"
# (no uses "Deploy from a branch" a la vez que este workflow)

name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar que Pages está bien configurado
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pages;
            try {
              const res = await github.rest.repos.getPages({ owner, repo });
              pages = res.data;
            } catch (err) {
              if (err.status === 404) {
                core.setFailed(
                  "GitHub Pages no está activado en este repositorio.\n" +
                  "Ve a Settings → Pages y elige Source: GitHub Actions (o activa Pages si no aparece)."
                );
                return;
              }
              throw err;
            }
            if (pages.build_type !== "workflow") {
              core.setFailed(
                `Pages está en modo "${pages.build_type}" pero este workflow necesita Source: GitHub Actions.\n` +
                "Settings → Pages → Build and deployment → Source → GitHub Actions."
              );
            }

      - name: Preparar archivos del sitio
        run: |
          mkdir -p _site
          cp index.html adonde.html .nojekyll _site/
          cp -r css js _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
